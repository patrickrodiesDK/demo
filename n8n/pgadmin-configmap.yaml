---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-configmap
  namespace: database
  labels:
    app: pgadmin
    component: configmap
data:
  PGADMIN_DEFAULT_EMAIL: "admin@pgadmin.com"
  PGADMIN_LISTEN_PORT: "80"
  PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
  #PGADMIN_CONFIG_LOGIN_BANNER: '"Welcome to pgAdmin for n8n PostgreSQL"'